name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Disable cleanup: Gradle 8.9+ make removeUnusedEntriesOlderThan write-only,
          # and setup-gradle's post-step would otherwise mark the job failed.
          cache-cleanup: never

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Build with Gradle
        run: |
          ./gradlew zipRelease zipDebug

      - name: Prepare artifact
        if: success()
        id: prepareArtifact
        run: |
          set -euo pipefail
          ls -la module/release/
          release_zip=$(ls module/release/Tricky*Store*v*-release.zip | head -n1)
          debug_zip=$(ls module/release/Tricky*Store*v*-debug.zip | head -n1)
          releaseName=$(basename "$release_zip" .zip)
          debugName=$(basename "$debug_zip" .zip)
          echo "releaseName=$releaseName" >> "$GITHUB_OUTPUT"
          echo "debugName=$debugName" >> "$GITHUB_OUTPUT"
          unzip -q "$release_zip" -d module-release
          unzip -q "$debug_zip" -d module-debug
          # sanity: version string in module.prop
          grep -E '^version=' module-release/module.prop || true
          cat module-release/module.prop

      - name: Upload release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepareArtifact.outputs.releaseName }}
          path: "./module-release/*"

      - name: Upload debug
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepareArtifact.outputs.debugName }}
          path: "./module-debug/*"

      - name: Upload release mappings
        uses: actions/upload-artifact@v4
        with:
          name: release-mappings
          path: "./service/build/outputs/mapping/release"
